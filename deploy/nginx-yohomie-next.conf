# Next.js 反代：HTTP 跳 HTTPS，HTTPS 全部流量（含 /_next/static）转发到 Node
# 证书路径由 certbot 生成；若路径不同，请按 /etc/letsencrypt/live/ 下实际目录修改

server {
  listen 80;
  listen [::]:80;
  server_name yohomie.cn www.yohomie.cn;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name yohomie.cn www.yohomie.cn;

  # 避免部分浏览器把 HTML 当成非 UTF-8 解析出现“乱码”
  charset utf-8;

  ssl_certificate /etc/letsencrypt/live/yohomie.cn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/yohomie.cn/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }
}
